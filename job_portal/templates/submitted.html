<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Submitted</title><link rel="stylesheet" href="{{ url_for('static', filename='portal.css') }}"></head><body><main class="confirmation"><p class="eyebrow">JOB SUBMITTED</p><h1>{{ kind|title }} is on its way.</h1><p>The scheduler accepted these jobs:</p><dl>{% for key, value in result.items() %}<dt>{{ key }}</dt><dd><code>{{ value }}</code></dd>{% endfor %}</dl><a class="button" href="{{ url_for('index') }}">Submit another job</a></main></body></html>
